{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --color-primary: #263045;
        --color-secondary: #b99f6e;
    }

    /* Общие стили */
    .content-bg {
        background-color: transparent;
        color: var(--color-primary);
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background-color: transparent;
        border: 1px solid var(--color-secondary);
        color: var(--color-primary);
        width: 100%;
    }

    .card-header {
        background-color: transparent;
        border-bottom: 1px solid var(--color-secondary);
        color: var(--color-primary);
        text-align: center;
        padding: 1.5rem;
    }

    .card-header h4 {
        color: var(--color-primary);
        border-bottom: 2px solid var(--color-secondary);
        padding-bottom: 0.5rem;
        margin: 0;
        font-size: 1.25rem;
    }

    .card-body {
        padding: 1.5rem;
    }

    .form-label {
        color: var(--color-primary);
        display: block;
        margin-bottom: 0.5rem;
    }

    /* Контейнер для поля пароля с кнопкой */
    .password-field {
        position: relative;
        width: 100%;
    }

    .form-control {
        background-color: transparent;
        border: 1px solid var(--color-secondary);
        color: var(--color-primary);
        width: 100%;
        padding: 0.75rem;
        border-radius: 4px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        background-color: transparent;
        border-color: var(--color-primary);
        color: var(--color-primary);
        box-shadow: 0 0 0 0.2rem rgba(38, 48, 69, 0.25);
        outline: none;
    }

    .form-control::placeholder {
        color: rgba(38, 48, 69, 0.6);
    }

    /* Стили для кнопки просмотра пароля */
    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-primary);
        opacity: 0.7;
        transition: opacity 0.3s ease;
        font-size: 1.2rem;
        line-height: 1;
    }

    .toggle-password:hover {
        opacity: 1;
    }

    .toggle-password:focus {
        outline: none;
        opacity: 1;
    }

    /* Кнопки */
    .btn-primary {
        background-color: transparent;
        border: 1px solid var(--color-secondary);
        color: var(--color-primary);
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        border-radius: 4px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .btn-primary:hover,
    .btn-primary:focus {
        background-color: var(--color-secondary);
        border-color: var(--color-secondary);
        color: var(--color-primary);
    }

    .btn-primary:active {
        background-color: var(--color-secondary);
        border-color: var(--color-secondary);
        color: var(--color-primary);
    }

    /* Ссылки */
    .text-center a {
        color: var(--color-primary);
        text-decoration: none;
        border-bottom: 1px solid var(--color-secondary);
        transition: all 0.3s ease;
    }

    .text-center a:hover {
        color: var(--color-secondary);
        border-bottom-color: var(--color-secondary);
    }

    p, .text-center p {
        color: var(--color-primary);
        margin: 0;
    }

    /* Адаптивные стили */

    /* Мобильные устройства (< 576px) */
    @media (max-width: 575.98px) {
        .content-bg {
            padding: 15px;
            min-height: calc(100vh - 50px);
        }

        .container.py-5 {
            padding: 0 !important;
        }

        .col-md-6.col-lg-5 {
            padding: 0;
        }

        .card {
            border: 1px solid var(--color-secondary);
            margin: 0;
            width: 100%;
        }

        .card-header {
            padding: 1.25rem;
        }

        .card-header h4 {
            font-size: 1.1rem;
            padding-bottom: 0.5rem;
        }

        .card-body {
            padding: 1.25rem;
        }

        .form-control {
            padding: 14px;
            font-size: 16px;
            min-height: 48px;
        }

        .toggle-password {
            right: 10px;
            font-size: 1.1rem;
        }

        .form-label {
            font-size: 0.95rem;
        }

        .btn-primary {
            padding: 14px;
            font-size: 1rem;
            min-height: 48px;
        }

        .mt-4.pt-3.text-center {
            margin-top: 1.5rem !important;
            padding-top: 1rem !important;
            font-size: 0.9rem;
        }

        .text-center a {
            font-size: 0.9rem;
        }
    }

    /* Планшеты (от 576px до 768px) */
    @media (min-width: 576px) and (max-width: 767.98px) {
        .content-bg {
            padding: 20px;
        }

        .container.py-5 {
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
        }

        .col-md-6.col-lg-5 {
            max-width: 450px;
            margin: 0 auto;
        }

        .card-header h4 {
            font-size: 1.2rem;
        }

        .form-control {
            padding: 12px;
            font-size: 16px;
            min-height: 46px;
        }

        .btn-primary {
            padding: 12px;
            min-height: 46px;
        }

        .mt-4.pt-3.text-center {
            font-size: 0.95rem;
        }
    }

    /* Десктоп (от 768px) */
    @media (min-width: 768px) {
        .content-bg {
            padding: 30px;
        }

        .container.py-5 {
            padding-top: 3rem !important;
            padding-bottom: 3rem !important;
        }

        .col-md-6.col-lg-5 {
            max-width: 400px;
            margin: 0 auto;
        }

        .card-header h4 {
            font-size: 1.25rem;
        }

        .form-control {
            padding: 10px 12px;
            min-height: 44px;
        }

        .btn-primary {
            padding: 10px 12px;
            min-height: 44px;
        }

        .mt-4.pt-3.text-center {
            font-size: 1rem;
        }
    }

    /* Большие экраны (от 992px) */
    @media (min-width: 992px) {
        .col-md-6.col-lg-5 {
            max-width: 450px;
        }

        .card-header {
            padding: 2rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-control {
            padding: 12px 15px;
        }

        .btn-primary {
            padding: 12px 15px;
        }
    }

    /* Улучшения для сенсорных устройств */
    .btn-primary,
    .form-control,
    .toggle-password {
        touch-action: manipulation;
    }

    .form-control:focus {
        border-width: 2px;
    }

    /* Адаптивное выравнивание */
    @media (max-width: 575.98px) {
        .row.justify-content-center {
            margin: 0;
        }

        .text-center p {
            line-height: 1.5;
        }
    }

    /* Исправление для iOS */
    @supports (-webkit-touch-callout: none) {
        .form-control {
            font-size: 16px !important;
        }

        .btn-primary {
            font-size: 16px !important;
        }
    }

    /* Анимации */
    .card {
        transition: transform 0.3s ease;
    }

    @media (hover: hover) and (pointer: fine) {
        .card:hover {
            transform: translateY(-2px);
        }
    }

    /* Валидация полей */
    .form-control:invalid {
        border-color: var(--color-primary);
    }

    /* Улучшение доступности для фокуса */
    .btn-primary:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }
</style>

<div class="content-bg">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">Вход в систему</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя *</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       value="{{ username if username else '' }}"
                                       placeholder="Введите имя пользователя"
                                       required
                                       autocomplete="username">
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Пароль *</label>
                                <div class="password-field">
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="Введите пароль"
                                           required
                                           autocomplete="current-password">
                                    <button type="button" class="toggle-password" aria-label="Показать/скрыть пароль">
                                        <span class="password-toggle-icon">Показать️</span>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
                        </form>

                        <div class="mt-4 pt-3 text-center">
                            <p class="mb-0">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйтесь</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // === Функционал показа/скрытия пароля ===
        const passwordField = document.getElementById('password');
        const toggleButton = document.querySelector('.toggle-password');
        const toggleIcon = document.querySelector('.password-toggle-icon');

        if (passwordField && toggleButton) {
            toggleButton.addEventListener('click', function() {
                // Определяем текущий тип поля
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);

                // Меняем иконку в зависимости от состояния
                if (type === 'text') {
                    toggleIcon.textContent = 'Скрыть';
                } else {
                    toggleIcon.textContent = 'Показать';
                }
            });
        }

        // Адаптивная инициализация
        function adaptLoginForm() {
            const isMobile = window.innerWidth < 576;
            const formControls = document.querySelectorAll('.form-control');
            const submitButton = document.querySelector('.btn-primary');

            if (isMobile) {
                // На мобильных улучшаем UX
                formControls.forEach(control => {
                    control.style.fontSize = '16px';
                    control.style.minHeight = '48px';
                });

                if (submitButton) {
                    submitButton.style.fontSize = '16px';
                    submitButton.style.minHeight = '48px';
                }

                // Автофокус на поле имени пользователя
                const usernameInput = document.getElementById('username');
                if (usernameInput && !usernameInput.value) {
                    setTimeout(() => {
                        usernameInput.focus();
                    }, 300);
                }
            } else {
                // На десктопе стандартные стили
                formControls.forEach(control => {
                    control.style.fontSize = '';
                    control.style.minHeight = '';
                });

                if (submitButton) {
                    submitButton.style.fontSize = '';
                    submitButton.style.minHeight = '';
                }
            }
        }

        // Выполняем при загрузке
        adaptLoginForm();

        // Обновляем при изменении размера окна
        window.addEventListener('resize', adaptLoginForm);

        // Улучшение для сенсорных устройств
        const submitButton = document.querySelector('.btn-primary');
        if (submitButton) {
            submitButton.addEventListener('touchstart', function() {
                this.style.opacity = '0.8';
            });

            submitButton.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        }

        // Валидация формы
        const form = document.querySelector('form[method="POST"]');
        if (form) {
            form.addEventListener('submit', function(e) {
                const username = document.getElementById('username');
                const password = document.getElementById('password');
                let isValid = true;

                if (!username.value.trim()) {
                    username.style.borderColor = 'var(--color-primary)';
                    isValid = false;
                } else {
                    username.style.borderColor = '';
                }

                if (!password.value.trim()) {
                    password.style.borderColor = 'var(--color-primary)';
                    isValid = false;
                } else {
                    password.style.borderColor = '';
                }

                if (!isValid) {
                    e.preventDefault();
                    alert('Пожалуйста, заполните все обязательные поля');
                    return false;
                }

                return true;
            });
        }

        // Улучшение доступности
        const formControls = document.querySelectorAll('.form-control');
        formControls.forEach(control => {
            control.addEventListener('focus', function() {
                this.style.borderWidth = '2px';
            });

            control.addEventListener('blur', function() {
                this.style.borderWidth = '';
            });
        });
    });
</script>
{% endblock %}
