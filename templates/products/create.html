{% extends "base.html" %}

{% block content %}
<h1>Добавить продукт</h1>
<form method="post">
    <div class="mb-3">
        <label class="form-label required">Наименование</label>
        <input type="text" class="form-control" name="name" required>
    </div>

    <div class="mb-3">
        <label class="form-label required">Описание</label>
        <textarea class="form-control" name="description" rows="4" required></textarea>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label required">Тип ЭВМ</label>
                <input type="text" class="form-control" name="computer_type" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label required">Язык программирования</label>
                <input type="text" class="form-control" name="programming_language" required>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label required">Операционная система</label>
                <input type="text" class="form-control" name="operating_system" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label required">Объем</label>
                <input type="text" class="form-control" name="volume" required>
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-success">Создать</button>
    <a href="{{ url_for('products_list') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
