{% extends "base.html" %}

{% block content %}
<h1>Редактировать автора</h1>
<form method="post">
    <div class="row">
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label required">Фамилия</label>
                <input type="text" class="form-control" name="surname" value="{{ author[1] }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label required">Имя</label>
                <input type="text" class="form-control" name="name" value="{{ author[2] }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control" name="patronymic" value="{{ author[3] or '' }}">
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label required">Дата рождения</label>
        <input type="date" class="form-control" name="birth_date" value="{{ author[4] }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label required">Адрес</label>
        <textarea class="form-control" name="address" rows="3" required>{{ author[5] }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label required">Подразделение</label>
        <input type="text" class="form-control" name="department" value="{{ author[6] }}" required>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label required">Паспорт</label>
                <input type="text" class="form-control" name="passport" value="{{ author[7] }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label required">СНИЛС</label>
                <input type="text" class="form-control" name="snils" value="{{ author[8] }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label class="form-label required">ИНН</label>
                <input type="text" class="form-control" name="inn" value="{{ author[9] }}" required>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_student" id="is_student" {{ 'checked' if author[10]
            }}>
            <label class="form-check-label" for="is_student">Студент</label>
        </div>
    </div>

    <div class="mb-3" id="position-field">
        <label class="form-label">Должность</label>
        <input type="text" class="form-control" name="position" value="{{ author[11] or '' }}">
    </div>

    <button type="submit" class="btn btn-warning">Обновить</button>
    <a href="{{ url_for('authors_list') }}" class="btn btn-secondary">Отмена</a>
</form>

<script>
    document.getElementById('is_student').addEventListener('change', function() {
        const positionField = document.getElementById('position-field');
        if (this.checked) {
            positionField.style.display = 'none';
        } else {
            positionField.style.display = 'block';
        }
    });

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        const isStudent = document.getElementById('is_student');
        const positionField = document.getElementById('position-field');
        if (isStudent.checked) {
            positionField.style.display = 'none';
        } else {
            positionField.style.display = 'block';
        }
    });
</script>
{% endblock %}
