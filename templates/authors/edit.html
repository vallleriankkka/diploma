{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --color-primary: #263045;
        --color-secondary: #b99f6e;
    }

    .edit-author-page {
        color: var(--color-primary);
    }

    /* Кнопки */
    .edit-author-page .btn-outline-accent,
    .edit-author-page .btn-primary.btn-outline-accent,
    .edit-author-page .btn-secondary.btn-outline-accent {
        color: var(--color-primary);
        border: 1px solid var(--color-secondary);
        background-color: transparent;
        transition: all 0.3s ease;
        padding: 10px 25px;
    }

    .edit-author-page .btn-outline-accent:hover,
    .edit-author-page .btn-primary.btn-outline-accent:hover {
        background-color: var(--color-secondary);
        color: var(--color-primary);
        border-color: var(--color-secondary);
    }

    .edit-author-page .btn-secondary.btn-outline-accent {
        border-color: var(--color-primary);
    }

    .edit-author-page .btn-secondary.btn-outline-accent:hover {
        background-color: var(--color-primary);
        color: var(--color-secondary);
        border-color: var(--color-primary);
    }

    /* Поля формы */
    .edit-author-page .form-control,
    .edit-author-page .form-select {
        background-color: transparent;
        color: var(--color-primary);
        border: 1px solid var(--color-secondary);
        border-radius: 4px;
        padding: 12px 15px;
        font-size: 1rem;
        transition: all 0.3s ease;
        width: 100%;
    }

    .edit-author-page .form-control:focus,
    .edit-author-page .form-select:focus {
        background-color: transparent;
        color: var(--color-primary);
        border-color: var(--color-primary);
        box-shadow: 0 0 0 0.2rem rgba(38, 48, 69, 0.25);
        outline: none;
    }

    .edit-author-page .form-control::placeholder {
        color: rgba(38, 48, 69, 0.6);
    }

    /* Чекбоксы */
    .edit-author-page .form-check-input {
        border: 1px solid var(--color-secondary);
        background-color: transparent;
    }

    .edit-author-page .form-check-input:checked {
        background-color: var(--color-secondary);
        border-color: var(--color-secondary);
    }

    .edit-author-page .form-check-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 0.2rem rgba(38, 48, 69, 0.25);
    }

    .edit-author-page .form-check-label {
        color: var(--color-primary);
    }

    /* Метки */
    .edit-author-page .form-label {
        color: var(--color-primary);
        margin-bottom: 8px;
        display: block;
        font-size: 0.95rem;
    }

    .edit-author-page .form-label.required::after {
        content: " *";
        color: var(--color-secondary);
    }

    .edit-author-page .form-text {
        color: var(--color-primary);
        opacity: 0.8;
        font-size: 0.875rem;
        margin-top: 5px;
    }

    /* Текст */
    .edit-author-page .text-success,
    .edit-author-page .text-danger {
        color: var(--color-primary) !important;
    }

    .edit-author-page .text-danger {
        font-style: italic;
    }

    /* Заголовки */
    .edit-author-page h1 {
        color: var(--color-primary);
        border-bottom: 2px solid var(--color-secondary);
        padding-bottom: 10px;
        margin-bottom: 30px;
        font-size: 1.75rem;
    }

    /* Контейнер */
    .edit-author-page .container {
        background-color: transparent;
        padding: 20px;
        margin-top: 20px;
        max-width: 1000px;
    }

    /* Адаптивные стили */

    /* Мобильные устройства (< 576px) */
    @media (max-width: 575.98px) {
        .edit-author-page .container {
            padding: 15px;
            margin-top: 10px;
            width: 100%;
        }

        .edit-author-page h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-align: center;
            padding-bottom: 8px;
        }

        .form-control,
        .form-select {
            padding: 14px;
            font-size: 16px;
            min-height: 48px;
            width: 100%;
        }

        .row {
            margin-left: -5px;
            margin-right: -5px;
        }

        .col-md-4,
        .col-md-6 {
            padding-left: 5px;
            padding-right: 5px;
            margin-bottom: 15px;
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            min-height: 52px;
            margin-bottom: 10px;
            display: block;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .mb-3 {
            margin-bottom: 1.5rem !important;
        }

        .form-label {
            font-size: 1rem;
        }

        .form-text {
            font-size: 0.8rem;
        }
    }

    /* Планшеты (от 576px до 768px) */
    @media (min-width: 576px) and (max-width: 767.98px) {
        .edit-author-page .container {
            padding: 25px;
            max-width: 95%;
            margin: 20px auto;
        }

        .edit-author-page h1 {
            font-size: 1.6rem;
        }

        .form-control,
        .form-select {
            padding: 12px;
            font-size: 16px;
            min-height: 46px;
        }

        .btn {
            padding: 12px 24px;
            min-height: 46px;
            font-size: 1rem;
            margin-right: 10px;
            margin-bottom: 0;
        }

        .col-md-4,
        .col-md-6 {
            margin-bottom: 20px;
        }

        textarea.form-control {
            min-height: 80px;
        }

        .form-label {
            font-size: 0.95rem;
        }

        .form-text {
            font-size: 0.82rem;
        }
    }

    /* Десктоп (от 768px) */
    @media (min-width: 768px) {
        .edit-author-page .container {
            padding: 30px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .edit-author-page h1 {
            font-size: 1.75rem;
        }

        .form-control,
        .form-select {
            padding: 10px 12px;
            min-height: 44px;
        }

        .btn {
            padding: 10px 25px;
            min-height: 44px;
            margin-right: 15px;
        }

        .btn:last-child {
            margin-right: 0;
        }

        textarea.form-control {
            min-height: 80px;
        }

        .form-label {
            font-size: 0.95rem;
        }
    }

    /* Большие экраны (от 992px) */
    @media (min-width: 992px) {
        .edit-author-page .container {
            max-width: 1000px;
        }

        .col-md-4 {
            padding-left: 15px;
            padding-right: 15px;
        }

        .form-control,
        .form-select {
            padding: 12px 15px;
        }

        .btn {
            padding: 12px 15px;
        }
    }

    /* Улучшения для сенсорных устройств */
    .btn,
    .form-control,
    .form-select,
    .form-check-input {
        touch-action: manipulation;
    }

    /* Адаптивное выравнивание кнопок */
    @media (max-width: 575.98px) {
        form > .btn {
            display: block;
            width: 100%;
            margin: 0 0 10px 0 !important;
        }

        form > .btn:last-child {
            margin-bottom: 0 !important;
        }
    }

    @media (min-width: 576px) {
        form > .btn {
            display: inline-block;
            width: auto;
        }
    }

    /* Адаптивная сетка */
    @media (max-width: 767.98px) {
        .row .col-md-4,
        .row .col-md-6 {
            width: 100%;
        }
    }

    /* Исправление для iOS */
    @supports (-webkit-touch-callout: none) {
        .form-control,
        .form-select {
            font-size: 16px !important;
        }

        .btn {
            font-size: 16px !important;
        }
    }

    /* Анимации */
    .form-control,
    .form-select,
    .btn {
        transition: all 0.3s ease;
    }

    /* Валидация полей */
    .form-control:invalid {
        border-color: var(--color-primary);
    }

    /* Поля для студента/сотрудника */
    #education_level_field,
    #position_field {
        transition: all 0.3s ease;
    }
</style>

<div class="container edit-author-page">
    <h1>Редактирование автора</h1>

    <form method="post" id="authorForm">
        <div class="row">
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label required">Фамилия</label>
                <input type="text" class="form-control" name="surname" value="{{ author[1] }}" required
                       pattern="[А-Яа-яЁёA-Za-z\s\-]+" title="Только буквы, пробелы и дефисы"
                       placeholder="Введите фамилию">
            </div>
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label required">Имя</label>
                <input type="text" class="form-control" name="name" value="{{ author[2] }}" required
                       pattern="[А-Яа-яЁёA-Za-z\s\-]+" title="Только буквы, пробелы и дефисы" placeholder="Введите имя">
            </div>
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control" name="patronymic" value="{{ author[3] or '' }}"
                       pattern="[А-Яа-яЁёA-Za-z\s\-]*" title="Только буквы, пробелы и дефисы"
                       placeholder="Введите отчество">
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label required">Дата рождения</label>
                <input type="date" class="form-control" name="birth_date" id="birth_date"
                       value="{{ author[4].strftime('%Y-%m-%d') if author[4] else '' }}" required max="{{ today }}">
                <div class="form-text" id="ageInfo"></div>
            </div>
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label required">Гражданство</label>
                <input type="text" class="form-control" name="citizenship"
                       value="{{ author[13] or 'Российская Федерация' }}" required
                       pattern="[А-Яа-яЁёA-Za-z\s\-]+" title="Только буквы, пробелы и дефисы"
                       placeholder="Введите гражданство">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label required">Адрес</label>
            <textarea class="form-control" name="address" rows="3" required placeholder="Введите полный адрес">{{ author[5] }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label required">Подразделение</label>
            <input type="text" class="form-control" name="department"
                   value="{{ author[14] or '' }}"
                   required
                   placeholder="Например: Управление информационных технологий, Строительно-политехнический колледж">
            <div class="form-text">Например: "Факультет информатики", "Кафедра математики"</div>
        </div>

        <!-- Поля для паспортных данных -->
        <div class="row mb-3">
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label class="form-label required">Паспорт (серия и номер)</label>
                <input type="text" class="form-control" name="passport" id="passport"
                       value="{{ author[6] }}" required
                       placeholder="1234567890" maxlength="10">
                <div class="form-text">10 цифр без пробелов</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label class="form-label">Дата выдачи паспорта</label>
                <input type="date" class="form-control" name="passport_issue_date" id="passport_issue_date"
                       value="{{ author[15].strftime('%Y-%m-%d') if author[15] else '' }}" max="{{ today }}">
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label class="form-label">Кем выдан паспорт</label>
                <input type="text" class="form-control" name="passport_issued_by"
                       value="{{ author[16] or '' }}" placeholder="Например: ОВД г. Москвы">
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label class="form-label required">Код подразделения</label>
                <input type="text" class="form-control" name="passport_issued_code" id="passport_code"
                       value="{{ author[17] }}" required
                       placeholder="360-001" maxlength="7">
                <div class="form-text">Формат: 123-456</div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label required">СНИЛС</label>
                <input type="text" class="form-control" name="snils" id="snils"
                       value="{{ author[7] }}" required
                       placeholder="123-456-789 00" maxlength="14">
                <div class="form-text">Формат: 123-456-789 00</div>
            </div>
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label required">ИНН</label>
                <input type="text" class="form-control" name="inn" id="inn"
                       value="{{ author[8] }}" required
                       placeholder="123456789012" maxlength="12">
                <div class="form-text">12 цифр</div>
            </div>
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_student" id="is_student" value="true"
                       {% if author[9] %}checked{% endif %}>
                <label class="form-check-label" for="is_student">Студент</label>
            </div>
            <div class="form-text">Снимите галочку, если автор является сотрудником</div>
        </div>

        <!-- Поле уровня образования для студентов -->
        <div class="mb-3" id="education_level_field"
             style="display: {% if author[9] %}block{% else %}none{% endif %};">
            <label class="form-label">Уровень образования</label>
            <select class="form-select" name="education_level_id" id="education_select">
                <option value="">Выберите уровень образования</option>
                {% for level in education_levels %}
                <option value="{{ level[0] }}" {% if level[0]== author[18] %}selected{% endif %}>
                    {{ level[1] }}
                </option>
                {% endfor %}
            </select>
            <div class="form-text">Требуется для студентов</div>
        </div>

        <!-- Поле должности для сотрудников -->
        <div class="mb-3" id="position_field"
             style="display: {% if not author[9] %}block{% else %}none{% endif %};">
            <label class="form-label">Должность</label>
            <input type="text" class="form-control" name="position"
                   value="{{ author[10] or '' }}" placeholder="Введите должность сотрудника">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-outline-accent">Обновить</button>
            <a href="{{ url_for('authors_list') }}" class="btn btn-secondary btn-outline-accent">Отмена</a>
        </div>
    </form>
</div>

<script>
    // Адаптивная инициализация
    function adaptFormForMobile() {
        const isMobile = window.innerWidth < 576;
        const formControls = document.querySelectorAll('.form-control, .form-select');

        if (isMobile) {
            // На мобильных улучшаем UX
            formControls.forEach(control => {
                control.style.fontSize = '16px';
                control.style.minHeight = '48px';
            });

            // Автофокус на первое поле
            const firstInput = document.querySelector('.form-control');
            if (firstInput && !firstInput.value) {
                setTimeout(() => {
                    firstInput.focus();
                }, 300);
            }
        } else {
            // На десктопе стандартные стили
            formControls.forEach(control => {
                control.style.fontSize = '';
                control.style.minHeight = '';
            });
        }
    }

    // Обработка чекбокса студента
    document.getElementById('is_student').addEventListener('change', function() {
        const positionField = document.getElementById('position_field');
        const educationField = document.getElementById('education_level_field');
        const educationSelect = document.getElementById('education_select');

        if (this.checked) {
            // Студент
            if (positionField) positionField.style.display = 'none';
            if (educationField) educationField.style.display = 'block';
            if (educationSelect) educationSelect.required = true;
        } else {
            // Сотрудник
            if (positionField) positionField.style.display = 'block';
            if (educationField) educationField.style.display = 'none';
            if (educationSelect) educationSelect.required = false;
        }
    });

    // Расчет возраста
    function calculateAge() {
        const birthDateInput = document.getElementById('birth_date');
        if (!birthDateInput.value) return;

        const birthDate = new Date(birthDateInput.value);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();

        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }

        const ageInfo = document.getElementById('ageInfo');
        if (ageInfo) {
            ageInfo.textContent = `Возраст: ${age}`;
            ageInfo.style.color = age < 14 ? 'var(--color-primary)' : 'var(--color-primary)';
        }
    }

    // Форматирование документов
    function formatPassportInput(input) {
        input.value = input.value.replace(/\D/g, '').substring(0, 10);
    }

    function formatPassportCodeInput(input) {
        let value = input.value.replace(/[^\d-]/g, '');
        const parts = value.split('-');
        if (parts.length > 2) {
            value = parts[0] + '-' + parts[1];
        }
        if (parts[0] && parts[0].length > 3) {
            value = parts[0].substring(0, 3) + '-' + (parts[1] || '');
        }
        if (parts[1] && parts[1].length > 3) {
            value = parts[0] + '-' + parts[1].substring(0, 3);
        }
        input.value = value;
    }

    function formatSnilsInput(input) {
        let value = input.value.replace(/[^\d-\s]/g, '');
        const cleanValue = value.replace(/[-\s]/g, '');

        if (cleanValue.length <= 3) {
            value = cleanValue;
        } else if (cleanValue.length <= 6) {
            value = cleanValue.substring(0, 3) + '-' + cleanValue.substring(3);
        } else if (cleanValue.length <= 9) {
            value = cleanValue.substring(0, 3) + '-' + cleanValue.substring(3, 6) + '-' + cleanValue.substring(6, 9);
        } else {
            value = cleanValue.substring(0, 3) + '-' + cleanValue.substring(3, 6) + '-' + cleanValue.substring(6, 9) + ' ' + cleanValue.substring(9, 11);
        }

        input.value = value.substring(0, 14);
    }

    function formatInnInput(input) {
        input.value = input.value.replace(/\D/g, '').substring(0, 12);
    }

    // Валидация формы
    document.getElementById('authorForm').addEventListener('submit', function(e) {
        const isStudent = document.getElementById('is_student').checked;
        const educationSelect = document.getElementById('education_select');
        const passportInput = document.getElementById('passport');
        const passportCodeInput = document.getElementById('passport_code');
        const snilsInput = document.getElementById('snils');
        const innInput = document.getElementById('inn');

        // Проверка студента
        if (isStudent && educationSelect && !educationSelect.value) {
            e.preventDefault();
            alert('Для студента необходимо выбрать уровень образования');
            educationSelect.focus();
            return false;
        }

        // Проверка паспорта
        if (passportInput && passportInput.value.length !== 10) {
            e.preventDefault();
            alert('Паспорт должен содержать 10 цифр');
            passportInput.focus();
            return false;
        }

        // Проверка кода подразделения
        if (passportCodeInput && !/^\d{3}-\d{3}$/.test(passportCodeInput.value)) {
            e.preventDefault();
            alert('Код подразделения должен быть в формате 123-456');
            passportCodeInput.focus();
            return false;
        }

        // Проверка СНИЛС
        if (snilsInput && !/^\d{3}-\d{3}-\d{3} \d{2}$/.test(snilsInput.value)) {
            e.preventDefault();
            alert('СНИЛС должен быть в формате 123-456-789 00');
            snilsInput.focus();
            return false;
        }

        // Проверка ИНН
        if (innInput && innInput.value.length !== 12) {
            e.preventDefault();
            alert('ИНН должен содержать 12 цифр');
            innInput.focus();
            return false;
        }

        return true;
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', function() {
        // Адаптивная инициализация
        adaptFormForMobile();
        window.addEventListener('resize', adaptFormForMobile);

        // Установка максимальной даты
        const today = "{{ today }}";
        document.getElementById('birth_date').max = today;
        document.getElementById('passport_issue_date').max = today;

        // Инициализация расчета возраста
        calculateAge();
        document.getElementById('birth_date').addEventListener('change', calculateAge);

        // Форматирование документов
        const passportInput = document.getElementById('passport');
        if (passportInput) {
            passportInput.addEventListener('input', () => formatPassportInput(passportInput));
        }

        const passportCodeInput = document.getElementById('passport_code');
        if (passportCodeInput) {
            passportCodeInput.addEventListener('input', () => formatPassportCodeInput(passportCodeInput));
        }

        const snilsInput = document.getElementById('snils');
        if (snilsInput) {
            snilsInput.addEventListener('input', () => formatSnilsInput(snilsInput));
        }

        const innInput = document.getElementById('inn');
        if (innInput) {
            innInput.addEventListener('input', () => formatInnInput(innInput));
        }

        // Улучшение для сенсорных устройств
        const submitButton = document.querySelector('.btn-primary');
        if (submitButton) {
            submitButton.addEventListener('touchstart', function() {
                this.style.opacity = '0.8';
            });

            submitButton.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        }
    });
</script>
{% endblock %}
